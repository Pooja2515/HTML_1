<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #303030 1px, transparent 2px),
                radial-gradient(circle at 75% 80%, #454545 1px, transparent 2px),
                #242424;
            background-size: 35px 35px, 50px 50px, auto;
        }

        .outer-container {
            width: 98%;
            min-height: 266px;
            background: #191919;
            border: 6px solid #252525;
            border-radius: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px;
        }

        .navbar {
            width: 100%;
            max-width: 1090px;
            min-height: 113px;
            background: #999999;
            border: 2px solid #a5a5a5;
            border-radius: 65px;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
        }

        .navbar a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #151515;
            font-size: clamp(16px, 2.8vw, 36px);
            font-weight: 500;
            padding: 25px 12px;
            border-radius: 55px;
            white-space: nowrap;
            transition: background 0.25s, color 0.25s;
        }

        .navbar a.active {
            background: #e0e0e5;
            color: #171717;
        }

        .navbar a.contact {
            background: #171717;
            color: white;
            flex: 1.15;
        }

        .navbar a:hover {
            background: #eeeeee;
            color: #111111;
        }

        .navbar a.contact:hover {
            background: #333333;
            color: white;
        }

        @media (max-width: 650px) {
            .outer-container {
                min-height: auto;
                padding: 15px;
                border-radius: 35px;
            }

            .navbar {
                min-height: auto;
                flex-wrap: wrap;
                border-radius: 30px;
                padding: 7px;
            }

            .navbar a {
                flex: 1 1 28%;
                padding: 14px 5px;
                font-size: 17px;
            }

            .navbar a.contact {
                flex: 1 1 28%;
            }
        }
    </style>
</head>
<body>
    <div class="outer-container">
        <nav class="navbar">
            <a href="#home">Home</a>
            <a href="#work">Work</a>
            <a href="#awards" class="active">Awards</a>
            <a href="#team">Team</a>
            <a href="#prices">Prices</a>
            <a href="#contact" class="contact">Contact</a>
        </nav>
    </div>
</body>
</html>
